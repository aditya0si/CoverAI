[tool.poetry]
name = "coverai-api"
version = "0.1.0"
description = "FastAPI backend for CoverAI"
authors = ["CoverAI Team <team@coverai.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11 || ^3.12 || ^3.13 || ^3.14"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pymupdf = "^1.24.0"
google-generativeai = "^0.8.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.1"
asyncpg = "^0.29.0"
pydantic-settings = "^2.2.1"
pydantic = "^2.6.4"
python-multipart = "^0.0.9"
bcrypt = "^5.0.0"
pyjwt = "^2.13.0"
redis = "^7.4.0"
slowapi = "^0.1.9"
prometheus-fastapi-instrumentator = "^7.0.0"
apscheduler = "^3.10.4"
cryptography = "^42.0.5"
python-json-logger = "^2.0.7"
httpx = "^0.27.0"
pgvector = "^0.2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
