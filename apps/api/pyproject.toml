[tool.poetry]
name = "coverai-api"
version = "0.1.0"
description = "FastAPI backend for CoverAI"
authors = ["CoverAI Team <team@coverai.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11 || ^3.12 || ^3.13 || ^3.14"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pymupdf = "^1.24.0"
openai = "^1.14.0"
google-generativeai = "^0.8.0"
python-dotenv = "^1.0.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pydantic-settings = "^2.2.1"
pydantic = "^2.6.4"
# Justified explicit upgrade: caret on a 0.0.x version pins the patch only, so
# ^0.0.9 could never resolve the locked-and-installed 0.0.32.
python-multipart = "^0.0.32"
passlib = "^1.7.4"
bcrypt = "^5.0.0"
pyjwt = "^2.13.0"
redis = "^7.4.0"
slowapi = "^0.1.9"
prometheus-fastapi-instrumentator = "^7.0.0"
apscheduler = "^3.10.4"
cryptography = "^42.0.5"
python-json-logger = "^2.0.7"
httpx = "^0.27.0"
pgvector = "^0.2.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poetry.group.dev.dependencies]
# Justified explicit upgrade: the project supports Python 3.11-3.14, but
# pytest ^8.0.0 / pytest-asyncio ^0.23.0 predate Python 3.14 support. These are
# the resolved, verified-working versions for the local 3.14 toolchain.
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
