# Render Blueprint — CoverAI API + Postgres (pgvector) + Key Value (Redis).
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → pick this repository → Apply.
# Two values are asked for at that moment (marked sync: false below):
#   FIELD_ENCRYPTION_KEY  a Fernet key (44 chars, generated for you in render-secrets.txt)
#   GEMINI_API_KEY        a Google AI Studio API key (free tier) for the AI features
#
# Notes that matter on the free instance type (512 MB RAM / 0.1 CPU):
#   * The service spins down after 15 minutes idle and cold-starts in about a minute.
#   * The free Postgres database expires 30 days after creation (Render's rule, not ours).
#   * The Key Value instance has no disk persistence: rate-limit counters reset on restart,
#     which is fine for this application.

# No `databases:` block: the free Render Postgres expires 30 days after creation.
# The database is Neon (pgvector) and is bound via DATABASE_URL below.

services:
  - type: web
    name: coverai-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    # Run the Alembic migrations (they create the pgvector extension and all tables,
    # and are idempotent) before serving traffic on Render's port.
    # No dockerCommand: Render EXECs it rather than shell-parsing it, so a chained "a && b"
    # fails (exit 127). The image ENTRYPOINT applies migrations, then serves on $PORT.
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      # Neon (free, no expiry, pgvector). Render free Postgres expires 30 days after
      # creation, so the database is deliberately outside this blueprint.
      - key: DATABASE_URL
        sync: false
      # Upstash Redis (free tier, no expiry once claimed). Previously a Render free
      # Key Value, which suspends on the same 30-day clock as the free Postgres.
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_BUCKET
        value: coverai-uploads
      - key: ALLOWED_ORIGINS
        value: https://cover-ai-web-adityasinghprojects.vercel.app
