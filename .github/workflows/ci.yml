name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - name: Install dependencies
        run: pnpm install

      - name: Lint web
        run: pnpm --filter web lint

      - name: Type check web
        run: pnpm --filter web exec tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install --upgrade pip
          pip install fastapi uvicorn "sqlalchemy[asyncio]" alembic asyncpg pydantic-settings pydantic python-multipart passlib bcrypt pyjwt redis slowapi prometheus-fastapi-instrumentator apscheduler cryptography python-json-logger httpx google-generativeai pymupdf pgvector numpy python-dotenv pytest pytest-asyncio

      - name: Run backend tests
        run: |
          cd apps/api
          pytest tests/ -v --tb=short
