name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coverai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coverai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coverai_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coverai_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-in-prod
      STORAGE_BUCKET: coverai-ci-bucket
      STORAGE_BACKEND: local
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-key' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Lint web
        run: pnpm --filter web lint

      - name: Type check web
        run: pnpm --filter web exec tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi 'uvicorn[standard]' pymupdf openai google-generativeai python-dotenv \
            'sqlalchemy[asyncio]' alembic psycopg2-binary asyncpg pydantic-settings pydantic \
            python-multipart passlib bcrypt pyjwt redis slowapi prometheus-fastapi-instrumentator \
            apscheduler cryptography python-json-logger httpx pgvector \
            pytest pytest-asyncio

      - name: Apply database migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: apps/api
        run: pytest tests/ -v --tb=short

      - name: Build web app
        run: pnpm --filter web build