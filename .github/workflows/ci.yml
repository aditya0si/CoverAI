name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coverai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coverai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coverai_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coverai_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-used-in-prod
      STORAGE_BUCKET: coverai-ci-bucket
      STORAGE_BACKEND: local
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-key' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Validate lockfile
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Apply database migrations
        run: poetry run alembic upgrade head

      - name: Run tests
        run: poetry run pytest -q

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Audit dependencies (pip-audit)
        run: poetry run python -m pip_audit

  web:
    name: Web (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter web lint

      - name: Type check web
        run: pnpm --filter web exec tsc --noEmit

      - name: Build web
        run: pnpm --filter web build

      - name: Audit web dependencies
        run: pnpm audit --audit-level=high
